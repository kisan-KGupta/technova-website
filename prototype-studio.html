<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechNova Solutions — Horizontal Interactive Prototype Studio</title>
  <meta name="description" content="Side-by-side horizontal comparative workbench for TechNova Solutions official Dark and Light working prototypes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --studio-bg: #071518;
      --studio-surface: #0C2126;
      --studio-border: rgba(131, 153, 88, 0.3);
      --studio-moss: #839958;
      --studio-text: #FAF8ED;
      --studio-muted: #8E9FAA;
      --studio-accent: #105666;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--studio-bg);
      color: var(--studio-text);
      font-family: 'Inter', -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Studio Bar */
    .studio-bar {
      background: var(--studio-surface);
      border-bottom: 1px solid var(--studio-border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 16px;
      z-index: 100;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo-img {
      height: 32px;
      width: auto;
    }

    .studio-title-badge {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 0.88rem;
      letter-spacing: 0.02em;
      color: var(--studio-text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chip-live {
      background: rgba(131, 153, 88, 0.2);
      border: 1px solid var(--studio-moss);
      color: #9CB270;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      padding: 2px 8px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #839958;
      box-shadow: 0 0 8px #839958;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Center Mode Selectors */
    .mode-controls {
      display: flex;
      align-items: center;
      background: rgba(7, 21, 24, 0.7);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid rgba(247, 244, 213, 0.12);
      gap: 4px;
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: var(--studio-muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .mode-btn:hover {
      color: var(--studio-text);
      background: rgba(131, 153, 88, 0.15);
    }

    .mode-btn.active {
      background: var(--studio-moss);
      color: #FFFFFF;
      box-shadow: 0 2px 10px rgba(131, 153, 88, 0.35);
    }

    /* Right Action Group */
    .action-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tool-toggle-btn {
      background: rgba(16, 86, 102, 0.35);
      border: 1px solid var(--studio-border);
      color: var(--studio-text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .tool-toggle-btn.active {
      background: rgba(131, 153, 88, 0.3);
      border-color: #9CB270;
      color: #FAF8ED;
    }

    .open-standalone-btn {
      background: linear-gradient(135deg, #839958 0%, #105666 100%);
      color: #FFFFFF;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .open-standalone-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(131, 153, 88, 0.4);
    }

    /* Main Horizontal Split Canvas */
    .studio-viewport {
      flex: 1;
      display: flex;
      width: 100%;
      height: calc(100vh - 54px);
      background: #040E10;
      overflow: hidden;
      position: relative;
    }

    .prototype-pane {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      border-right: 2px solid var(--studio-border);
      transition: flex 0.3s ease, width 0.3s ease;
      background: #071518;
    }

    .prototype-pane:last-child {
      border-right: none;
    }

    /* Pane Header Tag */
    .pane-header {
      background: var(--studio-surface);
      padding: 8px 16px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      border-bottom: 1px solid rgba(247, 244, 213, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .pane-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-chip {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .theme-chip-dark {
      background: #071518;
      color: #9CB270;
      border: 1px solid #839958;
    }

    .theme-chip-light {
      background: #FAF8ED;
      color: #0A3323;
      border: 1px solid #4D642D;
    }

    .pane-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--studio-muted);
    }

    /* Frame Wrapper */
    .frame-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    iframe.prototype-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Mobile Mockup Preset within Pane */
    .pane-mobile-center {
      background: #050e10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .mobile-device-shell {
      width: 390px;
      height: 92%;
      max-height: 844px;
      background: #000;
      border: 8px solid #1E293B;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(131, 153, 88, 0.2);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .mobile-speaker-notch {
      width: 120px;
      height: 18px;
      background: #1E293B;
      border-radius: 0 0 12px 12px;
      margin: 0 auto;
      z-index: 10;
    }

    /* Tablet Device Shell (iPad 4:3 Bezel) */
    .tablet-device-shell {
      width: 720px;
      height: 94%;
      max-height: 860px;
      background: #000;
      border: 14px solid #1E293B;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(131, 153, 88, 0.25);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .tablet-camera-pinhole {
      width: 8px;
      height: 8px;
      background: #0F172A;
      border-radius: 50%;
      margin: 4px auto 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 10;
    }

    /* Laptop Device Shell (MacBook Pro 16:9 Bezel) */
    .laptop-shell {
      width: 100%;
      max-width: 960px;
      height: 88%;
      background: #000;
      border: 12px solid #1E293B;
      border-bottom: 22px solid #0F172A;
      border-radius: 16px 16px 4px 4px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(16, 86, 102, 0.3);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .laptop-camera-notch {
      width: 60px;
      height: 10px;
      background: #0F172A;
      border-radius: 0 0 6px 6px;
      margin: 0 auto;
      z-index: 10;
    }

    /* Triple Hardware Rack Container */
    .pane-triple-center {
      background: #030a0c;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
      overflow-x: auto;
      overflow-y: hidden;
      height: 100%;
      width: 100%;
    }

    .triple-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      flex-shrink: 0;
    }

    .triple-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 700;
      color: #8E9FAA;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.05em;
    }

    .triple-item-desktop { width: 540px; }
    .triple-item-tablet { width: 380px; }
    .triple-item-mobile { width: 220px; }

    /* Hidden Pane State */
    .prototype-pane.pane-hidden {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Top Studio Control Bar -->
  <header class="studio-bar">
    <div class="brand-group">
      <img src="technova-logo-dark.svg" alt="TechNova" class="brand-logo-img">
      <span class="studio-title-badge">
        Interactive Prototype Studio
      </span>
      <span class="chip-live">
        <span class="pulse-dot"></span>
        60 FPS WEBGL LIVE
      </span>
    </div>

    <!-- Center Layout Modes -->
    <div class="mode-controls">
      <button class="mode-btn active" id="btn-mode-split" title="Align Dark and Light Working Prototypes Horizontally Side-by-Side">
        <span>◫ Split (Dark vs Light)</span>
      </button>
      <button class="mode-btn" id="btn-mode-triple" title="Desktop, Tablet & Mobile Hardware Bezels Aligned Horizontally">
        <span>💻📱 Triple Hardware Rack</span>
      </button>
      <button class="mode-btn" id="btn-mode-tablet" title="Field Supervisor Tablet Frame (1024x768 iPad Bezel)">
        <span>📟 Field Tablet Frame</span>
      </button>
      <button class="mode-btn" id="btn-mode-responsive" title="Desktop + Mobile Responsive Pair Aligned Horizontally">
        <span>📱 Desktop & Mobile Pair</span>
      </button>
      <button class="mode-btn" id="btn-mode-dark-solo" title="Single Fullscreen Dark Theme">
        <span>🌙 Dark Solo</span>
      </button>
      <button class="mode-btn" id="btn-mode-light-solo" title="Single Fullscreen Light Theme">
        <span>☀️ Light Solo</span>
      </button>
    </div>

    <!-- Right Utility Group -->
    <div class="action-group">
      <button class="tool-toggle-btn active" id="btn-sync-scroll" title="Synchronize vertical scrolling across both horizontal panes">
        <span>🔗 Sync Scroll: ON</span>
      </button>
      <a href="index.html" target="_blank" class="open-standalone-btn" title="Open standalone full-size prototype in new browser tab">
        <span>Open Standalone ↗</span>
      </a>
    </div>
  </header>

  <!-- Horizontal Viewport -->
  <main class="studio-viewport" id="viewport-container">

    <!-- Left Pane: Official Dark Theme Working Prototype -->
    <section class="prototype-pane" id="pane-left">
      <div class="pane-header">
        <div class="pane-title">
          <span class="theme-chip theme-chip-dark">DARK THEME</span>
          <span>Official TechNova B2B Portal (Production Build)</span>
        </div>
        <div class="pane-meta">Three.js WebGL · Dave HUD · 100% Zero-Install</div>
      </div>
      <div class="frame-wrapper" id="frame-wrapper-left">
        <iframe src="index.html" class="prototype-frame" id="frame-left" title="TechNova Dark Working Prototype"></iframe>
      </div>
    </section>

    <!-- Right Pane: Official Light Theme Working Prototype -->
    <section class="prototype-pane" id="pane-right">
      <div class="pane-header">
        <div class="pane-title">
          <span class="theme-chip theme-chip-light">LIGHT THEME</span>
          <span id="right-pane-heading">Official TechNova B2B Portal (Light Build)</span>
        </div>
        <div class="pane-meta" id="right-pane-meta">WCAG AAA Contrast · High-Key Palette</div>
      </div>
      <div class="frame-wrapper" id="frame-wrapper-right">
        <iframe src="index.html" class="prototype-frame" id="frame-right" title="TechNova Light Working Prototype"></iframe>
      </div>
    </section>

  </main>

  <script>
    const paneLeft = document.getElementById('pane-left');
    const paneRight = document.getElementById('pane-right');
    const frameLeft = document.getElementById('frame-left');
    const frameRight = document.getElementById('frame-right');
    const frameWrapperRight = document.getElementById('frame-wrapper-right');
    const rightPaneHeading = document.getElementById('right-pane-heading');

    const btnModeSplit = document.getElementById('btn-mode-split');
    const btnModeTriple = document.getElementById('btn-mode-triple');
    const btnModeTablet = document.getElementById('btn-mode-tablet');
    const btnModeResponsive = document.getElementById('btn-mode-responsive');
    const btnModeDarkSolo = document.getElementById('btn-mode-dark-solo');
    const btnModeLightSolo = document.getElementById('btn-mode-light-solo');
    const btnSyncScroll = document.getElementById('btn-sync-scroll');

    let syncScrollEnabled = true;

    // Apply Themes on Iframe Load
    frameLeft.addEventListener('load', () => {
      try {
        const doc = frameLeft.contentDocument || frameLeft.contentWindow.document;
        doc.documentElement.setAttribute('data-theme', 'dark');
        const logo = doc.querySelector('.brand-logo-img');
        if (logo) logo.src = 'technova-logo-dark.svg';
      } catch (err) {
        console.log('Cross-origin check:', err);
      }
    });

    frameRight.addEventListener('load', () => {
      try {
        const doc = frameRight.contentDocument || frameRight.contentWindow.document;
        doc.documentElement.setAttribute('data-theme', 'light');
        const logo = doc.querySelector('.brand-logo-img');
        if (logo) logo.src = 'technova-logo-light.svg';
      } catch (err) {
        console.log('Cross-origin check:', err);
      }
    });

    // Synchronized Scroll Logic
    function setupSynchronizedScroll() {
      let isSyncingLeft = false;
      let isSyncingRight = false;

      function bindScroll(sourceWin, targetWin, flagSetter) {
        if (!sourceWin || !targetWin) return;
        sourceWin.addEventListener('scroll', () => {
          if (!syncScrollEnabled) return;
          flagSetter(true);
          const scrollPct = sourceWin.scrollY / (sourceWin.document.documentElement.scrollHeight - sourceWin.innerHeight);
          const targetY = scrollPct * (targetWin.document.documentElement.scrollHeight - targetWin.innerHeight);
          targetWin.scrollTo(0, targetY);
          setTimeout(() => flagSetter(false), 50);
        });
      }

      try {
        bindScroll(frameLeft.contentWindow, frameRight.contentWindow, (val) => isSyncingLeft = val);
        bindScroll(frameRight.contentWindow, frameLeft.contentWindow, (val) => isSyncingRight = val);
      } catch (e) {}
    }

    setTimeout(setupSynchronizedScroll, 1200);

    // Mode: Horizontal Split (Dark vs Light)
    btnModeSplit.addEventListener('click', () => {
      clearModes();
      btnModeSplit.classList.add('active');
      paneLeft.classList.remove('pane-hidden');
      paneRight.classList.remove('pane-hidden');
      paneLeft.style.flex = '1';
      paneRight.style.flex = '1';
      frameWrapperRight.className = 'frame-wrapper';
      frameWrapperRight.innerHTML = `<iframe src="index.html" class="prototype-frame" id="frame-right" title="TechNova Light Working Prototype"></iframe>`;
      const newRight = document.getElementById('frame-right');
      newRight.addEventListener('load', () => {
        const doc = newRight.contentDocument || newRight.contentWindow.document;
        doc.documentElement.setAttribute('data-theme', 'light');
        const logo = doc.querySelector('.brand-logo-img');
        if (logo) logo.src = 'technova-logo-light.svg';
      });
      rightPaneHeading.textContent = 'Official TechNova B2B Portal (Light Build)';
      setTimeout(setupSynchronizedScroll, 1000);
    });

    // Mode: Triple Hardware Device Rack (MacBook + iPad + iPhone Side-by-Side)
    btnModeTriple.addEventListener('click', () => {
      clearModes();
      btnModeTriple.classList.add('active');
      paneLeft.classList.add('pane-hidden');
      paneRight.classList.remove('pane-hidden');
      paneRight.style.flex = '1';

      rightPaneHeading.textContent = 'Triple Hardware Device Rack (Desktop 1920px · Tablet 1024px · Mobile 390px)';
      frameWrapperRight.className = 'frame-wrapper pane-triple-center';
      frameWrapperRight.innerHTML = `
        <!-- MacBook Pro Desktop Frame -->
        <div class="triple-item triple-item-desktop">
          <div class="triple-label"><span>💻 MacBook Pro (16:9 Desktop)</span></div>
          <div class="laptop-shell">
            <div class="laptop-camera-notch"></div>
            <iframe src="index.html" class="prototype-frame" id="frame-triple-desktop" title="TechNova Desktop Frame"></iframe>
          </div>
        </div>

        <!-- iPad Field Tablet Frame -->
        <div class="triple-item triple-item-tablet">
          <div class="triple-label"><span>📟 iPad Field Tablet (4:3)</span></div>
          <div class="tablet-device-shell">
            <div class="tablet-camera-pinhole"></div>
            <iframe src="index.html" class="prototype-frame" id="frame-triple-tablet" title="TechNova Tablet Frame"></iframe>
          </div>
        </div>

        <!-- iPhone 15 Pro Mobile Frame -->
        <div class="triple-item triple-item-mobile">
          <div class="triple-label"><span>📱 iPhone 15 Pro (19.5:9)</span></div>
          <div class="mobile-device-shell">
            <div class="mobile-speaker-notch"></div>
            <iframe src="index.html" class="prototype-frame" id="frame-triple-mobile" title="TechNova Mobile Frame"></iframe>
          </div>
        </div>
      `;

      const tDesktop = document.getElementById('frame-triple-desktop');
      const tTablet = document.getElementById('frame-triple-tablet');
      const tMobile = document.getElementById('frame-triple-mobile');

      [tDesktop, tTablet, tMobile].forEach(f => {
        if (!f) return;
        f.addEventListener('load', () => {
          const doc = f.contentDocument || f.contentWindow.document;
          doc.documentElement.setAttribute('data-theme', 'dark');
          const logo = doc.querySelector('.brand-logo-img');
          if (logo) logo.src = 'technova-logo-dark.svg';
        });
      });
    });

    // Mode: Field Supervisor Tablet Frame Solo
    btnModeTablet.addEventListener('click', () => {
      clearModes();
      btnModeTablet.classList.add('active');
      paneLeft.classList.add('pane-hidden');
      paneRight.classList.remove('pane-hidden');
      paneRight.style.flex = '1';

      rightPaneHeading.textContent = 'Field Supervisor Tablet Frame (iPad 4:3 Chassis / 1024×768)';
      frameWrapperRight.className = 'frame-wrapper pane-mobile-center';
      frameWrapperRight.innerHTML = `
        <div class="tablet-device-shell">
          <div class="tablet-camera-pinhole"></div>
          <iframe src="index.html" class="prototype-frame" id="frame-tablet-solo" title="TechNova Field Tablet Prototype"></iframe>
        </div>
      `;
      const tSolo = document.getElementById('frame-tablet-solo');
      tSolo.addEventListener('load', () => {
        const doc = tSolo.contentDocument || tSolo.contentWindow.document;
        doc.documentElement.setAttribute('data-theme', 'dark');
        const logo = doc.querySelector('.brand-logo-img');
        if (logo) logo.src = 'technova-logo-dark.svg';
      });
    });

    // Mode: Desktop & Mobile Responsive Pair Aligned Horizontally
    btnModeResponsive.addEventListener('click', () => {
      clearModes();
      btnModeResponsive.classList.add('active');
      paneLeft.classList.remove('pane-hidden');
      paneRight.classList.remove('pane-hidden');
      paneLeft.style.flex = '1.4';
      paneRight.style.flex = '0.9';

      frameWrapperRight.className = 'frame-wrapper pane-mobile-center';
      frameWrapperRight.innerHTML = `
        <div class="mobile-device-shell">
          <div class="mobile-speaker-notch"></div>
          <iframe src="index.html" class="prototype-frame" id="frame-mobile-right" title="TechNova Mobile Working Prototype"></iframe>
        </div>
      `;
      rightPaneHeading.textContent = 'Mobile Executive Responsive View (390px)';
      const mobileFrame = document.getElementById('frame-mobile-right');
      mobileFrame.addEventListener('load', () => {
        const doc = mobileFrame.contentDocument || mobileFrame.contentWindow.document;
        doc.documentElement.setAttribute('data-theme', 'light');
        const logo = doc.querySelector('.brand-logo-img');
        if (logo) logo.src = 'technova-logo-light.svg';
      });
    });

    // Mode: Dark Solo Fullscreen
    btnModeDarkSolo.addEventListener('click', () => {
      clearModes();
      btnModeDarkSolo.classList.add('active');
      paneLeft.classList.remove('pane-hidden');
      paneRight.classList.add('pane-hidden');
      paneLeft.style.flex = '1';
    });

    // Mode: Light Solo Fullscreen
    btnModeLightSolo.addEventListener('click', () => {
      clearModes();
      btnModeLightSolo.classList.add('active');
      paneLeft.classList.add('pane-hidden');
      paneRight.classList.remove('pane-hidden');
      paneRight.style.flex = '1';
      frameWrapperRight.className = 'frame-wrapper';
      frameWrapperRight.innerHTML = `<iframe src="index.html" class="prototype-frame" id="frame-right" title="TechNova Light Working Prototype"></iframe>`;
      const newRight = document.getElementById('frame-right');
      newRight.addEventListener('load', () => {
        const doc = newRight.contentDocument || newRight.contentWindow.document;
        doc.documentElement.setAttribute('data-theme', 'light');
        const logo = doc.querySelector('.brand-logo-img');
        if (logo) logo.src = 'technova-logo-light.svg';
      });
      rightPaneHeading.textContent = 'Official TechNova B2B Portal (Light Build)';
    });

    // Toggle Sync Scroll
    btnSyncScroll.addEventListener('click', () => {
      syncScrollEnabled = !syncScrollEnabled;
      btnSyncScroll.classList.toggle('active', syncScrollEnabled);
      btnSyncScroll.querySelector('span').textContent = syncScrollEnabled ? '🔗 Sync Scroll: ON' : '🔗 Sync Scroll: OFF';
    });

    function clearModes() {
      [btnModeSplit, btnModeTriple, btnModeTablet, btnModeResponsive, btnModeDarkSolo, btnModeLightSolo].forEach(b => b && b.classList.remove('active'));
    }
  </script>
</body>
</html>
